---
name: Resolve Version
run-name: "Resolve Version (${{ inputs.bump }})"

# Reusable — resolve the release VERSION on a working branch: optionally bump a milestone
# (patch | minor | major), then commit + push if anything changed. Default (`bump: none`) just
# reads and returns the current VERSION so the caller can promote as-is.
#
# Auth: if the caller sets `vars.BOT_APP_ID` (+ `secrets.BOT_PRIVATE_KEY`, via `secrets: inherit`)
# the push goes through the fireball-actions-bot App — the bypass actor for PR-protected branches.
# Otherwise it falls back to GITHUB_TOKEN, which is fine for repos with no branch protection.

on:
  workflow_call:
    inputs:
      bump:
        description: 'Milestone bump before resolving (none | patch | minor | major)'
        required: false
        type: string
        default: none
      branch:
        description: 'Working branch to read/bump VERSION on'
        required: false
        type: string
        default: development
      avoid_tag_collision:
        description: 'Advance the patch until the candidate tag is unused'
        required: false
        type: boolean
        default: true
      extra_git_paths:
        description: 'Extra paths to `git add` alongside VERSION (space-separated)'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'The resolved VERSION string'
        value: ${{ jobs.resolve.outputs.version }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    concurrency: version-bump-${{ inputs.branch }}
    permissions:
      contents: read  # pushes go through the token resolved below
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Generate bot token
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          token: ${{ steps.bot.outputs.token || github.token }}

      - name: Milestone bump
        if: ${{ inputs.bump != 'none' }}
        uses: fireballenterprise/workflows_common/actions/bump_version@v1
        with:
          part: ${{ inputs.bump }}

      - name: Resolve version
        id: resolve
        run: |
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ inputs.avoid_tag_collision }}" = "true" ]; then
            while git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null 2>&1; do
              IFS=. read -r major minor patch <<< "$version"
              version="$major.$minor.$((patch + 1))"
            done
          fi
          printf '%s\n' "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Resolved VERSION $version" >> "$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086
          git add VERSION ${{ inputs.extra_git_paths }}
          if git diff --cached --quiet; then
            echo "VERSION unchanged at $version — promoting as-is"
          else
            # [skip ci]: a bot-token push re-triggers workflows; without it a push
            # to the working branch could loop the caller's deploy/version workflow
            git commit -m "chore: bump VERSION to $version [skip ci]"
            git push origin "HEAD:${{ inputs.branch }}"
          fi
