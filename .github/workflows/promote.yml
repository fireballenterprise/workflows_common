---
name: Promote
run-name: "Promote (${{ inputs.source }} -> ${{ inputs.target }})"

# Reusable — promote a source branch onto a target branch with a `--no-ff -X theirs` merge
# (source is the source of truth; on conflict its side wins). The family's dev -> main release step.
#
# Auth: same rule as resolve_version.yml — bot App if `vars.BOT_APP_ID` is set, else GITHUB_TOKEN.

on:
  workflow_call:
    inputs:
      source:
        description: 'Branch to promote from'
        required: false
        type: string
        default: development
      target:
        description: 'Branch to promote onto'
        required: false
        type: string
        default: main
      expected_source_sha:
        description: Optional tested source commit; abort if the branch advanced
        required: false
        type: string
        default: ''
      fast_forward_only:
        description: Refuse divergence instead of making a merge commit
        required: false
        type: boolean
        default: false
      message:
        description: 'Merge commit message'
        required: false
        type: string
        default: 'chore: release to production'

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # pushes go through the token resolved below
    steps:
      - name: Generate bot token
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0  # full history so source/target share a discoverable common ancestor
          token: ${{ steps.bot.outputs.token || github.token }}

      - name: Merge ${{ inputs.source }} to ${{ inputs.target }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
          FAST_FORWARD: ${{ inputs.fast_forward_only }}
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
          MESSAGE: ${{ inputs.message }}
        run: |
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          git fetch origin "$SOURCE" "$TARGET"
          source_sha="$(git rev-parse "origin/$SOURCE")"
          if [ -n "$EXPECTED_SHA" ] && [ "$source_sha" != "$EXPECTED_SHA" ]; then
            echo 'Source branch changed since validation; rerun the workflow.'
            exit 1
          fi
          git checkout "$TARGET"
          if [ "$FAST_FORWARD" = "true" ]; then
            git merge --ff-only "$source_sha"
          else
            git merge "$source_sha" --no-ff -X theirs -m "$MESSAGE"
          fi
          git push origin "$TARGET"
